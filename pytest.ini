[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# H3 守卫执法路径的永久证明要用 pytester 夹具（tests/test_data_guard_enforcement.py）。
# `pytest_plugins = pytester` 只能在 rootdir 的 conftest.py 里声明，而本仓的 conftest 在
# tests/ 下（非顶层 conftest 声明它会被 pytest 直接判错），所以用 addopts 早期加载插件。
addopts = -p pytester
markers =
    production_identity: 本机回环地址按真实规则识别，不在测试里当成管理员
