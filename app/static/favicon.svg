<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Checkmark -->
  <polyline points="18,34 28,44 46,22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Config gear hint - small tooth marks on right -->
  <rect x="50" y="8" width="5" height="4" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="52" y="15" width="5" height="4" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="50" y="22" width="5" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
</svg>