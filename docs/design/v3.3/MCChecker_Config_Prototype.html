function textWithLinks(text){
  let result='',position=0;const value=String(text||'');
  for(const match of value.matchAll(/https?:\/\/[^\s<>"'，。；（）【】《》“”‘’]+/gi)){
    result+=e(value.slice(position,match.index));let raw=match[0].replace(/[.,;!?，。；！？]+$/,'');
    for(const [open,close] of [['(',')'],['[',']'],['{','}']])while(raw.endsWith(close)&&raw.split(close).length>raw.split(open).length)raw=raw.slice(0,-1);
    try{const url=MCPrototypeModel.normalizeLinks([raw])[0];result+='<a href="'+e(url)+'" target="_blank" rel="noopener noreferrer">'+e(raw)+'</a>'+e(match[0].slice(raw.length));}catch(_){result+=e(match[0]);}
    position=match.index+match[0].length;
  }
  return result+e(value.slice(position));
}
function relatedLinks(links){

eck','sm quiet','data-review="'+e(r.id)+'" data-comment="'+e(c.id)+'"')+'</div>':'')+'</article>').join('')+(r.status!=='merged'?'<form id="comment-form" class="comment-form"><label class="field"><span class="label">评审意见或补充说明</span><textarea id="comment-body" required placeholder="说明需要核对的内容或验证结果"></textarea></label><div class="row"><select class="control" id="comment-param" aria-label="评论关联参数"><option value="">整个修改</option>'+options(r.proposedParams,'',p=>p.name)+'</select><span class="spacer"></span><button class="btn" type="submit">'+ic('comment')+'添加评论</button></div></form>':'')+'</section></div><aside><section class="panel"><div class="side-section"><h3>合并前核对</h3>'+check(!stale,stale?'目标已有新记录，需重新核对':'目标与提交时一致')+check(!unresolved,unresolved?unresolved+' 条讨论尚未解决':'讨论已解决')+check(r.approvals.length>0,r.approvals.length?'已由 '+actor(r.approvals[0].actorId).name+' 审阅':'等待另一位管理员审阅')+(stale?'<p class="error-text">原建议已保留，请与最新配置重新核对。</p>' + btn('重新核对','rebase-review','compare',null,'data-review="'+e(r.id)+'" '+disabled()) + '':'')+'<div class="pane-actions">'+(r.status==='merged'?link('查看保存结果',fileUrl(file,'parameters')+'?branch='+e(b.id)+'&revision='+e(r.mergedRevisionId),'check','primary'):r.status==='approved'?btn('合并到配置','merge-review','branch','primary','data-review="'+e(r.id)+'" '+(canMerge?'':'disabled')):btn('通过评审','approve-review','check','primary','data-review="'+e(r.id)+'" '+(canApprove?'':'disabled')))+'</div>'+(r.status!=='merged'&&r.authorId===M.state.actorId?'<p class="help-note">此评审需另一位管理员确认，可在右上角切换示例操作人。</p>':'')+'</div><div class="side-section"><div class="side-stat"><span>目标</span><strong>'+e(b.label)+'</strong></div><div class="side-stat"><span>提交时记录</span><strong>'+e(recordTitle(file,base))+'</strong></div><div class="side-stat"><span>软件版本</span><strong>'+e(base.releaseId)+'</strong></div><p class="side-note">合并更新管理系统中的配置，已有机台需单独采用。</p></div></section></aside></div>',[{label:file.name,url:fileUrl(file)},{label:r.id}]);}
function comparePage(file){const b=branch(file),a=rev(file,S.compareA||S.query.left)||rev(file,b.headId);if(!a){shell(empty('没有可比较的保存记录','先初始化文件。',link('返回文件',fileUrl(file))),[{label:file.name}]);return;}const rightRecord=rev(file,S.compareB)||rev(file,a.parentIds[0])||a;S.compareA=a.id;S.compareB=rightRecord.id;const changes=M.diff(a.params,S.external?.params||rightRecord.params);shell(fileHeading(file,link('返回参数',fileUrl(file,'parameters'),'chevron'))+fileTabs(file,'parameters')+'<section class="panel work-panel"><div class="toolbar"><label class="small">左侧 <select class="control" id="compare-left">'+options(file.revisions.slice().reverse(),a.id,r=>recordTitle(file,r))+'</select></label>'+ic('compare')+'<label class="small">右侧 <select class="control" id="compare-right" '+(S.external?'disabled':'')+'>'+options(file.revisions.slice().reverse(),rightRecord.id,r=>recordTitle(file,r))+'</select></label><span class="spacer"></span><label class="btn">'+ic('upload')+'与文件比较<input class="visually-hidden" type="file" id="compare-upload" accept=".json,.xml"></label>'+(S.external?btn('清除文件','clear-external',null,'quiet'):'')+'</div>'+(S.external?'<div class="info-line">'+ic('file')+e(S.external.name)+' · 按完整字段路径对应；未知字段只在本次比较显示，不创建正式参数。</div>':'')+'<div class="diff-summary"><strong>'+changes.length+' 项变化</strong><span class="muted">'+changes.filter(x=>x.kind==='added').length+' 新增 · '+changes.filter(x=>x.kind==='removed').length+' 移除 · '+changes.filter(x=>x.fields.some(v=>v.field==='name')).length+' 更名</span><span class="spacer"></span>'+btn('交换左右','swap-compare','compare','sm quiet',S.external?'disabled':'')+'</div><div class="grow scroll-region">'+(changes.length?diffTable(pageRows(changes),recordTitle(file,a),S.external?.name||recordTitle(file,rightRecord)):empty('两份配置一致','名称、属性、取值方式和值均没有差异。'))+'</div>'+paginate(changes.length)+'</section>',[{label:file.name,url:fileUrl(file)},{label:'比较'}],true);}
function commonBase(file,target,source){if(!target||!source)return null;const cache=new Map();function ancestors(id){if(cache.has(id))return cache.get(id);const found=new Set(),queue=[id];for(let i=0;i<queue.length;i++){const id=queue[i];if(found.has(id))continue;const r=rev(file,id);if(!r)continue;found.add(id);queue.push(...r.parentIds);}cache.set(id,found);return found;}const a=ancestors(target.id),b=ancestors(source.id),common=[...a].filter(id=>b.has(id)),nearest=common.filter(id=>!common.some(other=>other!==id&&ancestors(other).has(id)));return nearest.length===1?nearest[0]:null;}
function conflictFields(row){const list=(row.conflicts||[]).map(x=>typeof x==='string'?x:x.field).filter(Boolean);return list.map(x=>fields[x]?x:'record').filter((x,i,a)=>a.indexOf(x)===i);}

function mergeMissing(plan){return plan.conflicts.reduce((n,row)=>n+conflictFields(row).filter(key=>!S.decisions[decisionKey(row.paramId,key)]).length,0);}
function mergedParams(){const plan=S.mergePlan,out=copy(plan.params);for(const row of plan.conflicts){for(const field of conflictFields(row)){const choice=S.decisions[decisionKey(row.paramId,field)];if(!choice)throw new Error('请先选择所有冲突处理方式');const chosen=choice==='source'?row.source:row.target;let at=out.findIndex(p=>p.id===row.paramId);if(field==='membership'||field==='record'){if(at>=0)out.splice(at,1);if(chosen)out.push(copy(chosen));}else{if(at<0)throw new Error('参数已移除，请重新核对');out[at][field]=copy(chosen?.[field]);}}}const file=f(plan.fileId),target=branch(file,plan.targetBranchId),source=rev(file,plan.sourceRevisionId);if(target.kind==='machine'&&branch(file,source.branchId).kind==='baseline'){for(const p of out){const base=source.params.find(x=>x.id===p.id);if(p.mode==='inherit'&&(!base||val(p.value)!==val(base.value)||p.type!==base.type||p.unit!==base.unit))p.mode='override';}}return out;}
function mergeValue(p,row){if(!p)return '<span class="muted">不存在</span>';return row.fields.map(x=>'<div class="field-change"><span class="muted">'+e(fields[x.field]||x.field)+'</span><span class="mono">'+fmt(x.field==='membership'?'存在':p[x.field],x.field)+'</span></div>').join('');}
function mergePage(file){const targetBranch=branch(file,S.query.target||S.branchId),target=rev(file,targetBranch.headId);if(!target){shell(empty('目标尚未初始化','先导入或建立目标配置。',link('返回版本',fileUrl(file,'roadmap'))),[{label:file.name}]);return;}const candidates=file.revisions.filter(r=>r.id!==target.id&&r.kind!=='initial'),baseline=rev(file,file.branches.find(b=>b.kind==='baseline'&&b.releaseId===target.releaseId)?.headId),source=rev(file,S.query.source)||(baseline?.id!==target.id?baseline:null)||candidates[0];if(!source){shell(empty('没有其他记录可合并','先建立来源配置。',link('返回版本',fileUrl(file,'roadmap'))),[{label:file.name}]);return;}const baseId=commonBase(file,target,source);let plan=S.mergePlan;if(!plan||plan.workspaceId!==M.state.workspaceId||plan.fileId!==file.id||plan.targetBranchId!==targetBranch.id||plan.targetRevisionId!==target.id||plan.sourceRevisionId!==source.id){S.decisions={};plan=baseId?M.planMerge(file.id,{baseRevisionId:baseId,targetRevisionId:target.id,sourceRevisionId:source.id}):null;if(plan)Object.assign(plan,{workspaceId:M.state.workspaceId,fileId:file.id,targetBranchId:targetBranch.id});S.mergePlan=plan;}const missing=plan?mergeMissing(plan):0,cross=target.releaseId!==source.releaseId;const content=plan?'<div class="diff-summary"><strong>'+plan.rows.length+' 项差异</strong>'+badge(missing?missing+' 个字段待选择':'差异已核对',missing?'amber':'green')+'<span class="muted">独立修改自动保留；冲突按字段选择。</span></div><div class="table-wrap grow"><table class="table merge-table"><thead><tr><th>参数</th><th>共同起点 · '+e(recordShort(file,rev(file,baseId)))+'</th><th>当前配置 · '+e(recordShort(file,target))+'</th><th>来源 · '+e(recordShort(file,source))+'</th><th>处理方式</th></tr></thead><tbody>'+pageRows(plan.rows).map(row=>'<tr><td class="param-name"><strong>'+e(row.name)+'</strong><div class="space-sm">'+(row.conflicts.length?badge('需要选择','amber'):badge('自动处理','green'))+'</div>'+(row.validationError?'<div class="error-text">'+e(row.validationError.message||row.validationError)+'</div>':'')+'</td><td class="d function diffViewContent(view){

function pagedDiffTable(changes,left,right,comments){
  if(changes.length<=50)return diffTable(changes,left,right,comments);
  const id='diff-'+(++diffViewSeq),view={id,changes,left,right,comments,page:0};diffViews.set(id,view);

  }
  if(target.dataset.editValue){
    const p=S.edit?.params.find(p=>p.id===target.dataset.editValue);if(!p)return;
    if(p.type==='boolean')p.value=target.value==='true';else if(p.type==='number'){
      try{p.value=MCPrototypeSources.numericValue(target.value.trim());target.removeAttribute('aria-invalid');}
      catch(_){p.value=target.value;target.setAttribute('aria-invalid','true');}
      delete p.rawNumeric;
    }else p.value=target.value;
    if(branch(f(S.edit.fileId),S.edit.branchId).kind==='machine'&&p.mode==='inherit'){
      const bp=reference(f(),branch(f()),rev(f(),S.edit.headId),S.edit)?.params.find(x=>x.id===p.id);
      let same=false;try{same=bp&&p.type===bp.type&&(p.type==='number'?MCPrototypeModel.compareDecimal(p.value,bp.value)===0:JSON.stringify(p.value)===JSON.stringify(bp.value));}catch(_){}
      if(!same){p.mode='override';const select=document.querySelector('[data-edit-mode="'+p.id+'"]');if(select)select.value='override';}
    }
    editCount();return;
  }
  if(target.id==='save-message'&&S.edit){S.edit.reason=S.edit.message=target.value;return;}
  if(target.id==='save-links'&&S.edit){S.edit.linksText=target.value;return;}
  if(target.id?.startsWith('init-')&&S.init){const map={'init-name':'name','init-release':'releaseId','init-description':'description','init-reason':'reason','init-links':'linksText'};if(map[target.id])S.init[map[target.id]]=target.value;return;}
  if(S.route.join('/')==='sources/new'&&(target.id?.startsWith('source-')||target.id?.startsWith('url-'))){
    captureSource();if(!['source-name','source-schedule','source-reason','source-links'].includes(target.id))invalidateSource();
  }
}
async function handleChange(target){
  const data=target.dataset||{};
  if(data.selectPage){
    const scope=S.selectionScope;if(!scope||scope.kind!==data.selectPage)throw new Error('选择范围已变化，请重试');
    scope.visibleIds.forEach(id=>target.checked?S.selected.add(id):S.selected.delete(id));render();return;
  }
  if(data.selectPickerPage!==undefined){S.tracePickScope?.visibleIds.forEach(id=>target.checked?S.tracePick.add(id):S.tracePick.delete(id));chooseParams(S.tracePickScope?.query||'');return;}
  if(data.selectPreviewAll!==undefined){captureSource();S.sourcePreview?.files.forEach(file=>{file.selected=target.checked;});render();return;}
  if(data.editValue){handleInput(target);return;}
  if(data.editMode){
    const p=S.edit?.params.find(p=>p.id===data.editMode);if(!p)return;ensureAdmin();
    if(target.value==='inherit'){
      const file=f(),b=branch(file),bp=reference(file,b,rev(file,S.edit.headId),S.edit)?.params.find(x=>x.id===p.id);
      if(!bp){target.value=p.mode;throw new Error('采用的基线中没有此参数，请保留单独设置');}
      Object.assign(p,{value:copy(bp.value),type:bp.type,unit:bp.unit,mode:'inherit'});delete p.rawNumeric;
    }else p.mode=target.value;render();return;
  }
  if(data.selectFile){target.checked?S.selected.add(data.selectFile):S.selected.delete(data.selectFile);render();return;}
  if(data.selectParam){target.checked?S.selected.add(data.selectParam):S.selected.delete(data.selectParam);render();return;}
  if(data.traceRecord){if(target.checked&&document.querySelectorAll('[data-trace-record]:checked').length>6){target.checked=false;throw new Error('最多同时比较 6 条，请先取消一条记录');}return;}
  if(data.tracePick){target.checked?S.tracePick.add(data.tracePick):S.tracePick.delete(data.tracePick);const count=document.getElementById('picker-selected-count');if(count)count.textContent='已选 '+S.tracePick.size+' 项';syncSelectionControls();return;}
  if(data.mergeId){S.decisions[decisionKey(data.mergeId,data.mergeField)]=target.value;render();return;}
  if(data.previewSelect!==undefined){if(S.sourcePreview)S.sourcePreview.files[Number(data.previewSelect)].selected=target.checked;syncSelectionControls();return;}
  if(data.previewTarget!==undefined){
    captureSource();const row=S.sourcePreview?.files[Number(data.previewTarget)];if(!row)return;row.target=target.value;row.branchId=target.value?f(target.value).branches.find(b=>b.kind==='baseline')?.id||'':'';render();return;
  }
  if(data.previewBranch!==undefined){if(S.sourcePreview)S.sourcePreview.files[Number(data.previewBranch)].branchId=target.value;return;}
  switch(target.id){
    case 'workspace':{
      const id=target.value;if(!M.state.workspaces.some(w=>w.id===id))throw new Error('工作区不存在');
      guardedChange(()=>{
        S.sourceSeq++;S.uploadSeq++;Sources.invalidate('source-form');M.state.workspaceId=id;
        Object.assign(S,{fileId:files()[0].id,branchId:files()[0].branches[0].id,revisionId:null,compareA:null,compareB:null,external:null,mergePlan:null,decisions:{},sourceDraft:null,sourcePreview:null,sourceBusy:false,init:null,traceIds:new Set(),traceRevs:[],selected:new Set(),candidate:null,bundle:null,search:'',page:0,roadmapSelected:null,roadmapBranch:'all',selectionScope:null,tracePickScope:null});
        closeOverlays();go('#/files');toast('已切换到 '+ws().name+'。');
      });return;
    }
    case 'branch':{const id=target.value;guardedChange(()=>go(fileUrl(f(),'parameters')+'?branch='+encodeURIComponent(id)));return;}
    case 'revision':{const id=target.value;guardedChange(()=>go(fileUrl(f(),'parameters')+'?branch='+encodeURIComponent(S.branchId)+(id?'&revision='+encodeURIComponent(id):'')));return;}
    case 'page-limit':S.limit=Number(target.value);S.page=0;render();return;
    case 'roadmap-page-size':S.limit=Number(target.value);S.page=0;render();return;
    case 'roadmap-focus':focusRoadmap(target.value);return;
    case 'param-filter':S.filter=target.value;S.page=0;render();return;
    case 'trace-file':{
      const file=f(target.value);setContext(file);S.traceIds=new Set();S.traceRevs=[];S.page=0;go('#/parameters?file='+encodeURIComponent(file.id));return;
    }
    case 'compare-left':S.compareA=target.value;S.external=null;S.uploadSeq++;S.page=0;render();return;
    case 'compare-right':S.compareB=target.value;S.page=0;render();return;
    case 'merge-source':S.mergePlan=null;S.decisions={};S.page=0;go(fileUrl(f(),'merge')+'?target='+encodeURIComponent(S.query.target||S.branchId)+'&source='+encodeURIComponent(target.value));return;
    case 'export-format':S.exportFormat=target.value;render();return;
    case 'export-revision':{const r=rev(f(),target.value);if(!r)throw new Error('保存记录不存在');S.revisionId=r.id;S.branchId=r.branchId;render();return;}
    case 'display-compact':S.compact=target.checked;render();return;
    case 'display-directories':S.directories=target.checked;render();return;
    case 'demo-actor':{
      if(S.edit){target.value=M.state.actorId;throw new Error('请先保存或暂存当前草稿，再切换示例操作人');}
      if(!M.state.actors.some(a=>a.id===target.value))throw new Error('操作人不存在');M.state.actorId=target.value;render();demoDialog();return;
    }
    case 'compare-upload':case 'init-upload':case 'branch-upload':{
      const request=++S.uploadSeq,wid=M.state.workspaceId,fid=S.fileId,hash=location.hash,bid=S.branchId,head=branch(f()).headId,mode=target.id;
      if(mode!=='compare-upload')ensureAdmin();
      const referenceParams=mode==='compare-upload'?(rev(f(),S.compareA)?.params||[]):mode==='branch-upload'?(rev(f(),head)?.params||[]):[];
      const valid=()=>request===S.uploadSeq&&wid===M.state.workspaceId&&fid===S.fileId&&hash===location.hash;
      let result;try{result=await readFile(target,referenceParams);}catch(err){if(valid())throw err;return;}
      if(!result||!valid())return;
      if(mode==='compare-upload'){S.external=result;S.page=0;render();toast('已读取 '+result.params.length+' 项参数。');}
      else if(mode==='init-upload'){Object.assign(S.init|| (S.init={releaseId:'691',description:''}),{name:result.name,format:result.format,params:result.params});render();}
      else{
        const file=f(fid),b=branch(file,bid);if(b.headId!==head)throw new Error('目标已有新记录，请重新核对导入位置');ensureNoDraft(file.id,b.id);openEditDraft(file,b,makeDraft(file,b,result.params,{message:'',operationDescription:'导入 '+result.name}));
      }return;
    }
    default:if(S.route.join('/')==='sources/new')handleInput(target);
  }
}
function render(){
  S.renderError=null;
  S.selectionScope=null;
  try{
    if(S.route[0]==='files'){
      if(!S.route[1])fileList();else{
        const file=f();switch(S.route[2]||'roadmap'){
          case 'parameters':parameterPage(file);break;case 'roadmap':case 'versions':roadmapPage(file);break;
          case 'reviews':reviewsPage(file);break;case 'updates':sourceList(file);break;
          case 'records':recordsPage(file);break;case 'compare':comparePage(file);break;
          case 'merge':mergePage(file);break;case 'export':exportPage(file);break;
          default:throw new Error('此文件视图不存在');
        }
      }
    }else switch(S.route[0]){
      case 'machines':machinePage();break;case 'parameters':tracePage();break;
      case 'reviews':reviewsPage();break;case 'review':reviewPage(S.route[1]);break;
      case 'sources':S.route[1]==='new'?sourceForm():sourceList();break;
      case 'records':recordsPage();break;case 'initialize':initializePage();break;
      default:throw new Error('此页面不存在');
    }
    syncSelectionControls();
  }catch(err){S.renderError=err.message;shell(empty('暂时无法打开此视图',err.message,link('返回文件','#/files')),[{label:'配置管理'}]);}
}
function navigate(){
  let hash=location.hash&&location.hash!=='#'?location.hash:'#/files/f-machine/roadmap';
  if(/#\/files\/[^/?]+\/versions(?:[?#]|$)/.test(hash)){hash=hash.replace('/versions','/roadmap');history.replaceState(null,'',hash);}
  if(S.edit&&S.lastHash&&hash!==S.lastHash&&!S.allowNavigation){
    history.replaceState(null,'',S.lastHash);leaveDialog(()=>go(hash));return;
  }
  S.allowNavigation=false;const changed=S.lastHash!==hash;
  if(changed){clearTimeout(searchTimer);S.uploadSeq++;S.sourceSeq++;Sources.invalidate('source-form');closeOverlays();}
  const [path,query]=hash.slice(2).split('?'),route=path.split('/').filter(Boolean),q=Object.fromEntries(new URLSearchParams(query||''));
  const oldFile=S.fileId,newFile=route[0]==='files'&&route[1]?route[1]:route[0]==='parameters'&&q.file?q.file:S.fileId;
  if(route[0]==='files'&&route[1]&&!route[2])route.push('roadmap');S.route=route;S.query=q;
  if(!files().some(file=>file.id===newFile)){
    if(route[0]==='files'&&route[1]){S.fileId=newFile;S.lastHash=hash;render();return;}
    S.fileId=files()[0].id;
  }else S.fileId=newFile;
  if(S.fileId!==oldFile){S.branchId=f().branches[0].id;S.roadmapSelected=null;S.roadmapBranch='all';S.traceIds=new Set();S.traceRevs=[];S.compareA=null;S.compareB=null;S.external=null;S.mergePlan=null;S.decisions={};S.exportFormat=f().format;}
  if(route[0]==='review'){
    const review=reviews().find(r=>r.id===route[1]);if(review){S.fileId=review.fileId;S.branchId=review.branchId;}
  }
  if(q.branch&&f().branches.some(b=>b.id===q.branch))S.branchId=q.branch;
  else if(!f().branches.some(b=>b.id===S.branchId))S.branchId=f().branches[0].id;
  S.revisionId=q.revision&&rev(f(),q.revision)?q.revision:null;
  if(S.revisionId)S.branchId=rev(f(),S.revisionId).branchId;
  if(changed&&route[2]==='roadmap'&&(q.revision||q.branch))S.roadmapSelected=S.revisionId||branch(f(),S.branchId).headId;
  if(changed){
    S.page=0;S.search='';S.category='all';S.filter='all';S.selected=new Set();
    if(route[0]==='files'&&route[2]==='compare'){S.compareA=q.left||null;S.compareB=q.right||null;S.external=null;}
    S.sourceDraft=null;S.sourcePreview=null;S.sourceBusy=false;
  }
  S.lastHash=hash;render();if(changed)document.getElementById('page-title')?.focus();
}
// Push navigation synchronously so draft creation and the following confirmation share one context.
go=function(url){if(location.hash!==url)history.pushState(null,'',url);navigate();};
document.addEventListener('click',ev=>{
  const skip=ev.target.closest('[data-skip]');if(skip){ev.preventDefault();document.getElementById('main-content')?.focus();return;}
  const action=ev.target.closest('[data-action]');if(action){ev.preventDefault();if(action.disabled)return;Promise.resolve(handleAction(action.dataset.action,action)).catch(errorMessage);return;}
  const anchor=ev.target.closest('a[href^="#/"]');if(anchor){ev.preventDefault();go(anchor.getAttribute('href'));}
});
document.addEventListener('input',ev=>{try{handleInput(ev.target);}catch(err){errorMessage(err);}});
document.addEventListener('change',ev=>{Promise.resolve(handleChange(ev.target)).catch(errorMessage);});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='comment-form')return;ev.preventDefault();
  try{M.addComment(S.route[1],{body:inputValue('comment-body'),paramId:inputValue('comment-param')||null});render();toast('评论已添加。');}catch(err){errorMessage(err);}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='/'&&!ev.ctrlKey&&!ev.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName||'')&&!document.querySelector('dialog[open]')){ev.preventDefault();(document.querySelector('[data-search="main"]')||document.getElementById('roadmap-search'))?.focus();}
});
window.addEventListener('hashchange',navigate);
window.addEventListener('popstate',()=>{if(location.hash!==S.lastHash)navigate();});
window.addEventListener('beforeunload',ev=>{if(S.edit||Object.keys(S.drafts).length){ev.preventDefault();ev.returnValue='';}});
for(const id of ['dialog','drawer'])document.getElementById(id).addEventListener('cancel',()=>{S.leaveCallback=null;});
window.MCPrototypeApp={model:M,state:S,sources:Sources,render,navigate,handleAction,handleChange,handleInput,go,beginEdit,reviewEdit,mergedParams,commonBase,detailParam,sourceAdoption,restoreDraft};
navigate();
})();
</script>
