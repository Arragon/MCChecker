<script>'use strict';

/*
 * In-memory configuration domain for the standalone MCChecker prototype.
 * Public reads are detached copies. A draft is a complete editor session, while
 * current and history always refer to saved revisions. No operation sends data
 * to a machine, and creating a version never copies its predecessor's values.
 */
class ConfigModel {
  constructor() {
    this.files = [
      { id: 0, name: 'MachineConfig.xml', group: '整机运行配置', format: 'XML' },
      { id: 1, name: '标准参数.json', group: '检测参数', format: 'JSON' }
    ];
    this._parameters = new Map();
    this._versions = new Map([[0, []], [1, []]]);
    this._machines = new Map([[0, []], [1, []]]);
    this._history = new Map();
    this._revisions = new Map();
    this._revisionOwners = new Map();
    this._events = new Map([[0, []], [1, []]]);
    this._revisionSequence = 0;
    this._eventSequence = 0;
    this._versionSequence = 104;
    this._machineSequence = 4;
    this._demoSequences = new Map([[0, 0], [1, 0]]);
    this._seed();
  }

  _copy(value) { return value == null ? value : JSON.parse(JSON.stringify(value)); }
  _key(fileId, kind, id) { return `${Number(fileId)}:${kind}:${Number(id)}`; }
  _file(fileId) {
    const file = this.files.find(item => item.id === Number(fileId));
    if (!file) throw new Error('找不到此配置文件。');
    return file;
  }
  _rawObject(fileId, kind, id) {
    if (kind !== 'standard' && kind !== 'machine') return null;
    const collection = kind === 'standard' ? this._versions : this._machines;
    return (collection.get(Number(fileId)) || []).find(item => item.id === Number(id)) || null;
  }
  _requireObject(fileId, kind, id) {
    this._file(fileId);
    const object = this._rawObject(fileId, kind, id);
    if (!object) throw new Error('此对象不属于当前配置文件。');
    return object;
  }
  _requireSession(session) {
    if (!session || typeof session !== 'object') throw new Error('编辑会话不存在。');
    return this._requireObject(session.fileId, session.kind, session.id);
  }
  _map(fileId, property = 'initial', fallback = '') {
    return Object.fromEntries((this._parameters.get(Number(fileId)) || []).map(param => [param.id, param[property] ?? fallback]));
  }
  _modes(fileId, mode) { return Object.fromEntries(this._parameters.get(Number(fileId)).map(param => [param.id, mode])); }
  _values(fileId, values) {
    return Object.fromEntries(this._parameters.get(Number(fileId)).map(param => [param.id, String(values?.[param.id] ?? '')]));
  }
  _sessionCopy(session) {
    return {
      fileId: Number(session.fileId), kind: session.kind, id: Number(session.id),
      baseRevisionId: session.baseRevisionId ?? null,
      values: this._values(session.fileId, session.values),
      modes: Object.fromEntries(this._parameters.get(Number(session.fileId)).map(param => [param.id, session.modes?.[param.id] ?? (session.kind === 'standard' ? 'fixed' : 'standard')])),
      targetVersion: String(session.targetVersion ?? ''),
      sourceRevisionId: session.sourceRevisionId ?? null
    };
  }
  _baseline(session) {
    const object = this._requireSession(session);
    if (session.baseRevisionId != null) {
      const owner = this._revisionOwners.get(session.baseRevisionId);
      if (owner === this._key(session.fileId, session.kind, session.id)) return this._revisions.get(session.baseRevisionId);
    }
    return {
      values: object.current?.values || (session.kind === 'standard' ? object.initialValues : null) || this._map(session.fileId, '_blank'),
      modes: object.current?.modes || this._modes(session.fileId, session.kind === 'standard' ? 'fixed' : 'standard'),
      version: object.version,
      sourceRevisionId: object.current?.sourceRevisionId ?? null
    };
  }
  _revision(fileId, kind, object, values, modes, options = {}) {
    const revision = {
      id: `rev-${String(++this._revisionSequence).padStart(5, '0')}`,
      values: this._values(fileId, values),
      modes: this._copy(modes),
      time: options.time || new Date().toISOString(),
      author: options.author || '陈工',
      version: String(options.version ?? object.version),
      sourceRevisionId: options.sourceRevisionId ?? null,
      note: String(options.note || '')
    };
    const key = this._key(fileId, kind, object.id);
    this._revisions.set(revision.id, revision);
    this._revisionOwners.set(revision.id, key);
    if (!this._history.has(key)) this._history.set(key, []);
    this._history.get(key).unshift(revision);
    object.current = revision;
    object.version = revision.version;
    return revision;
  }
  _event(fileId, kind, object, action, detail, time, author = '陈工') {
    const event = {
      id: `event-${String(++this._eventSequence).padStart(5, '0')}`,
      objectKind: kind, objectId: object.id,
      objectName: kind === 'standard' ? `软件 ${object.version}` : object.name,
      action, detail, time: time || new Date().toISOString(), author, ip: '192.168.10.42'
    };
    this._events.get(Number(fileId)).unshift(event);
    return event;
  }
  _savedStandard(fileId, version) {
    const standard = (this._versions.get(Number(fileId)) || []).find(item => item.version === String(version));
    if (!standard?.current) throw new Error('请先保存所选软件版本的标准参数。');
    return standard;
  }
  _checkSource(session) {
    const object = this._requireSession(session);
    if (session.kind === 'standard') {
      if (String(session.targetVersion) !== object.version) throw new Error('标准参数必须保存在所属软件版本中。');
      if (session.sourceRevisionId != null) throw new Error('标准参数不能引用机台的来源记录。');
      return;
    }
    const standard = this._savedStandard(session.fileId, session.targetVersion);
    const source = this._revisions.get(session.sourceRevisionId);
    const owner = this._revisionOwners.get(session.sourceRevisionId);
    if (!source || owner !== this._key(session.fileId, 'standard', standard.id) || source.version !== String(session.targetVersion)) {
      throw new Error('机台配置缺少与目标版本对应的标准来源，请重新核对更新。');
    }
  }

  parameters(fileId) { this._file(fileId); return this._copy(this._parameters.get(Number(fileId))); }
  versions(fileId) { this._file(fileId); return this._copy(this._versions.get(Number(fileId))); }
  machines(fileId) { this._file(fileId); return this._copy(this._machines.get(Number(fileId))); }
  object(fileId, kind, id) { return this._copy(this._rawObject(fileId, kind, id)); }
  history(fileId, kind, id) { return this._copy(this._history.get(this._key(fileId, kind, id)) || []); }
  events(fileId) { this._file(fileId); return this._copy(this._events.get(Number(fileId))); }
  revision(id) { return this._copy(this._revisions.get(id) || null); }
  standardFor(fileId, version) {
    return this._copy((this._versions.get(Number(fileId)) || []).find(item => item.version === String(version)) || null);
  }

  begin(fileId, kind, id) {
    const object = this._requireObject(fileId, kind, id);
    if (object.draft) return this._copy(object.draft);
    const saved = object.current;
    return {
      fileId: Number(fileId), kind, id: object.id,
      baseRevisionId: saved?.id ?? null,
      values: this._copy(saved?.values || (kind === 'standard' ? object.initialValues : null) || this._map(fileId, '_blank')),
      modes: this._copy(saved?.modes || this._modes(fileId, kind === 'standard' ? 'fixed' : 'standard')),
      targetVersion: object.version,
      sourceRevisionId: saved?.sourceRevisionId ?? null
    };
  }

  changes(session) {
    const baseline = this._baseline(session);
    return this._parameters.get(Number(session.fileId)).flatMap(param => {
      const oldValue = String(baseline.values[param.id] ?? '');
      const newValue = String(session.values?.[param.id] ?? '');
      const oldMode = baseline.modes[param.id];
      const newMode = session.modes?.[param.id];
      return oldValue === newValue && oldMode === newMode ? [] : [{ param: this._copy(param), oldValue, newValue, oldMode, newMode }];
    });
  }

  validate(session) {
    this._requireSession(session);
    const errors = {};
    for (const param of this._parameters.get(Number(session.fileId))) {
      const rawValue = session.values?.[param.id];
      const value = rawValue == null ? '' : String(rawValue);
      if (param.type === 'number') {
        const numeric = Number(value);
        if (!value.trim() || !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(value.trim()) || !Number.isFinite(numeric)) {
          errors[param.id] = '请输入有效数字。';
        } else if (param.min != null && numeric < param.min) {
          errors[param.id] = `不得小于 ${param.min}${param.unit === '—' ? '' : ` ${param.unit}`}。`;
        } else if (param.max != null && numeric > param.max) {
          errors[param.id] = `不得大于 ${param.max}${param.unit === '—' ? '' : ` ${param.unit}`}。`;
        }
      } else if (param.type === 'boolean' && value !== 'true' && value !== 'false') {
        errors[param.id] = '请选择 true 或 false。';
      } else if (param.type === 'text' && rawValue != null && typeof rawValue === 'object') {
        errors[param.id] = '请输入文本。';
      }
      if (!['standard', 'custom', 'fixed'].includes(session.modes?.[param.id]) && !errors[param.id]) {
        errors[param.id] = '请选择有效的取值方式。';
      }
    }
    return errors;
  }

  isDirty(session) {
    const object = this._requireSession(session);
    if (!object.current) return true;
    const saved = object.current;
    return this._parameters.get(Number(session.fileId)).some(param =>
      String(session.values?.[param.id] ?? '') !== String(saved.values[param.id] ?? '')
      || session.modes?.[param.id] !== saved.modes[param.id])
      || String(session.targetVersion) !== saved.version
      || (session.sourceRevisionId ?? null) !== saved.sourceRevisionId;
  }

  stash(session) {
    const object = this._requireSession(session);
    object.draft = this._sessionCopy(session);
    this._event(session.fileId, session.kind, object, '暂存草稿', `${this.changes(session).length} 项参数变化${session.targetVersion !== object.version ? `，目标版本 ${session.targetVersion}` : ''}`);
    return this._copy(object.draft);
  }

  discardDraft(fileId, kind, id) {
    const object = this._requireObject(fileId, kind, id);
    if (!object.current) {
      const collection = kind === 'standard' ? this._versions : this._machines;
      collection.set(Number(fileId), collection.get(Number(fileId)).filter(item => item.id !== object.id));
      this._history.delete(this._key(fileId, kind, id));
      // A provisional version can be selected as another version's predecessor.
      // Removing it also removes that now-invalid relation, without changing
      // any saved parameter revision or inventing a replacement predecessor.
      if (kind === 'standard') {
        for (const version of this._versions.get(Number(fileId))) {
          if (version.previousId === object.id) version.previousId = null;
        }
      }
      return { removed: true };
    }
    object.draft = null;
    return { removed: false };
  }

  save(session, note = '') {
    const object = this._requireSession(session);
    if ((session.baseRevisionId ?? null) !== (object.current?.id ?? null)) {
      const error = new Error('此配置已被其他编辑保存。你的修改仍然保留，请先核对最新记录。');
      error.code = 'CONFLICT';
      throw error;
    }
    const errors = this.validate(session);
    if (Object.keys(errors).length) {
      const error = new Error('请先修正标记的参数，再保存配置。');
      error.code = 'VALIDATION';
      error.errors = errors;
      throw error;
    }
    this._checkSource(session);
    const changeCount = this.changes(session).length;
    const previousVersion = object.version;
    const savedSession = this._sessionCopy(session);
    const revision = this._revision(session.fileId, session.kind, object, savedSession.values, savedSession.modes, {
      version: savedSession.targetVersion, sourceRevisionId: savedSession.sourceRevisionId, note
    });
    object.draft = null;
    this._event(session.fileId, session.kind, object,
      session.kind === 'standard' ? '保存标准参数' : '保存机台配置',
      `${changeCount} 项参数变化${previousVersion !== revision.version ? `，软件 ${previousVersion} → ${revision.version}` : ''}${note ? `；${note}` : ''}`,
      revision.time, revision.author);
    return this._copy(revision);
  }

  standardValues(session) {
    const object = this._requireSession(session);
    if (session.kind === 'standard') return this._copy(object.initialValues || this._map(session.fileId, '_blank'));
    return this._copy(this._savedStandard(session.fileId, session.targetVersion).current.values);
  }

  _compareSession(session, targetVersion) {
    if (session.kind !== 'machine') throw new Error('只有机台配置可以更新到其他标准。');
    this._requireSession(session);
    const target = this._savedStandard(session.fileId, targetVersion);
    const source = this._revisions.get(session.sourceRevisionId);
    const sourceOwner = this._revisionOwners.get(session.sourceRevisionId);
    if (!source || !sourceOwner?.startsWith(`${Number(session.fileId)}:standard:`)) throw new Error('无法找到此机台采用的原标准记录。');
    return this._parameters.get(Number(session.fileId)).map(param => {
      const oldValue = String(source.values[param.id] ?? '');
      const currentValue = String(session.values[param.id] ?? '');
      const newValue = String(target.current.values[param.id] ?? '');
      const mode = session.modes[param.id];
      let status;
      // Fixed is a deliberate lock. Custom is deliberate even when numerically
      // equal to the old standard; equality never creates source inheritance.
      if (mode === 'fixed') status = 'custom';
      else if (mode === 'custom') status = oldValue !== newValue && currentValue !== newValue ? 'conflict' : 'custom';
      // Standard mode is an explicit choice to adopt the target standard.
      // A single-field reset may already use a newer standard than the machine's
      // original whole-configuration baseline; it must not become an override
      // solely because its numeric value differs from that older baseline.
      else status = currentValue === newValue ? 'unchanged' : 'update';
      return { param: this._copy(param), oldValue, currentValue, newValue, status };
    });
  }

  compareUpgrade(fileId, machineId, targetVersion) {
    const object = this._requireObject(fileId, 'machine', machineId);
    // Comparing a saved machine must not quietly consume its stored draft.
    const current = object.current;
    const session = current ? {
      fileId: Number(fileId), kind: 'machine', id: object.id,
      baseRevisionId: current.id, values: current.values, modes: current.modes,
      targetVersion: current.version, sourceRevisionId: current.sourceRevisionId
    } : this.begin(fileId, 'machine', machineId);
    return this._compareSession(session, targetVersion);
  }

  compareSessionUpgrade(session, targetVersion) {
    return this._copy(this._compareSession(session, targetVersion));
  }

  applyUpgrade(session, targetVersion, decisions = {}) {
    const rows = this._compareSession(session, targetVersion);
    const unresolved = rows.filter(row => row.status === 'conflict' && !['current', 'new'].includes(decisions[row.param.id]));
    if (unresolved.length) {
      const error = new Error(`还有 ${unresolved.length} 项冲突需要选择处理方式。`);
      error.code = 'UNRESOLVED_CONFLICT';
      error.parameters = unresolved.map(row => row.param.id);
      throw error;
    }
    const next = this._sessionCopy(session);
    for (const row of rows) {
      const id = row.param.id;
      const choice = decisions[id];
      if (choice === 'new' || (row.status === 'update' && choice !== 'current')) {
        next.values[id] = row.newValue;
        next.modes[id] = 'standard';
      } else if (choice === 'current' && row.currentValue !== row.newValue && next.modes[id] !== 'fixed') {
        next.modes[id] = 'custom';
      }
    }
    const target = this._savedStandard(session.fileId, targetVersion);
    next.targetVersion = target.version;
    next.sourceRevisionId = target.current.id;
    return next;
  }

  newVersion(fileId, version, previousId = null) {
    this._file(fileId);
    version = String(version ?? '').trim();
    if (!version) throw new Error('请填写软件版本号。');
    if (this.standardFor(fileId, version)) throw new Error('当前文件中已存在此软件版本。');
    if (previousId != null) this._requireObject(fileId, 'standard', previousId);
    const object = {
      id: ++this._versionSequence, version, fileId: Number(fileId),
      previousId: previousId == null ? null : Number(previousId),
      initialValues: null, current: null, draft: null
    };
    this._versions.get(Number(fileId)).push(object);
    object.draft = {
      fileId: Number(fileId), kind: 'standard', id: object.id,
      baseRevisionId: null, values: this._map(fileId, '_blank'), modes: this._modes(fileId, 'fixed'),
      targetVersion: version, sourceRevisionId: null
    };
    this._event(fileId, 'standard', object, '创建软件版本', previousId == null ? '等待录入或导入参数' : '已记录上一版本关系，参数等待录入或导入');
    return this._copy(object);
  }

  newMachine(fileId, name, version) {
    this._file(fileId);
    name = String(name ?? '').trim();
    if (!name) throw new Error('请填写机台编号。');
    if (this._machines.get(Number(fileId)).some(item => item.name === name)) throw new Error('当前文件中已存在此机台编号。');
    const source = this._savedStandard(fileId, version);
    const object = { id: ++this._machineSequence, name, fileId: Number(fileId), version: source.version, current: null, draft: null };
    this._machines.get(Number(fileId)).push(object);
    object.draft = {
      fileId: Number(fileId), kind: 'machine', id: object.id, baseRevisionId: null,
      values: this._copy(source.current.values), modes: this._modes(fileId, 'standard'),
      targetVersion: source.version, sourceRevisionId: source.current.id
    };
    this._event(fileId, 'machine', object, '创建机台', `采用软件 ${source.version} 的已保存标准，等待首次保存`);
    return this._copy(object);
  }

  importValues(session, values, namesOnly = false) {
    this._requireSession(session);
    const imported = this._sessionCopy(session);
    if (namesOnly) return imported;
    for (const param of this._parameters.get(Number(session.fileId))) {
      if (Object.prototype.hasOwnProperty.call(values || {}, param.id)) {
        imported.values[param.id] = String(values[param.id] ?? '');
        // Importing a value is an explicit override, not a new source reference.
        if (session.kind === 'machine' && imported.values[param.id] !== session.values[param.id] && imported.modes[param.id] !== 'fixed') imported.modes[param.id] = 'custom';
      }
    }
    return imported;
  }

  exportText(fileId, values, format = 'XML') {
    const file = this._file(fileId);
    const parameters = this._parameters.get(Number(fileId));
    const tree = Object.create(null);
    for (const param of parameters) {
      const path = param.field.split('/').filter(Boolean);
      let branch = tree;
      for (const segment of path.slice(0, -1)) branch = branch[segment] || (branch[segment] = Object.create(null));
      let value = String(values?.[param.id] ?? '');
      if (String(format).toUpperCase() === 'JSON') {
        if (param.type === 'boolean' && (value === 'true' || value === 'false')) value = value === 'true';
        if (param.type === 'number' && value.trim() && Number.isFinite(Number(value))) value = Number(value);
      }
      branch[path[path.length - 1]] = value;
    }
    if (String(format).toUpperCase() === 'JSON') return `${JSON.stringify(tree, null, 2)}\n`;
    if (String(format).toUpperCase() !== 'XML') throw new Error('仅支持 XML 或 JSON 导出。');
    const escape = value => String(value)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]|[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '')
      .replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[character]))
      .replace(/\r/g, '&#13;');
    const xml = (branch, depth) => Object.entries(branch).map(([name, value]) => {
      const indent = '  '.repeat(depth);
      if (!/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(name)) throw new Error('文件字段包含无效的 XML 节点名称。');
      return value && typeof value === 'object'
        ? `${indent}<${name}>\n${xml(value, depth + 1)}\n${indent}</${name}>`
        : `${indent}<${name}>${escape(value)}</${name}>`;
    }).join('\n');
    const root = file.id === 0 ? 'MachineConfig' : 'StandardParameters';
    return `<?xml version="1.0" encoding="UTF-8"?>\n<${root}>\n${xml(tree, 1)}\n</${root}>\n`;
  }

  addDemoParameters(fileId, count) {
    this._file(fileId);
    if (!Number.isInteger(count) || count < 0 || count > 10000) throw new Error('扩展参数数量必须是 0 到 10000 的整数。');
    const added = [];
    for (let index = 0; index < count; index++) {
      const sequence = this._demoSequences.get(Number(fileId)) + 1;
      this._demoSequences.set(Number(fileId), sequence);
      const label = String(sequence).padStart(4, '0');
      added.push({ id: `demo-${Number(fileId)}-${label}`, name: `诊断通道 ${label} 阈值`, field: `Diagnostics/Channel${label}/Threshold`, group: '扩展参数', type: 'number', unit: 'mm', min: 0, max: 10000, initial: String((sequence % 200) + 1) });
    }
    this._parameters.get(Number(fileId)).push(...added);
    for (const [id, revision] of this._revisions) {
      const owner = this._revisionOwners.get(id);
      if (!owner.startsWith(`${Number(fileId)}:`)) continue;
      const machine = owner.includes(':machine:');
      for (const param of added) {
        revision.values[param.id] = param.initial;
        revision.modes[param.id] = machine ? 'standard' : 'fixed';
      }
    }
    for (const kind of ['standard', 'machine']) {
      const objects = (kind === 'standard' ? this._versions : this._machines).get(Number(fileId));
      for (const object of objects) {
        for (const param of added) {
          if (object.initialValues) object.initialValues[param.id] = param.initial;
          if (object.draft) {
            object.draft.values[param.id] = kind === 'standard' && !object.current ? '' : param.initial;
            object.draft.modes[param.id] = kind === 'standard' ? 'fixed' : 'standard';
          }
        }
      }
    }
    return this._copy(added);
  }

    const base = this._map(0);
    const initial680 = { ...base, feed: '90', acceleration: '260', exposure: '6', startDelay: '30' };

function fileTable(list){if(!list.length)return empty('没有匹配的配置文件','试试文件名或配置名称。',btn('清除搜索','clear-file-search'));return `<table class="table filetable"><thead><tr><th>文件名</th><th>软件版本</th><th>机台</th><th>待处理</th><th>最近保存</th><th><span class="sr-only">操作</span></th></tr></thead><tbody>${list.map(x=>{const vs=model.versions(x.id),ms=model.machines(x.id),latest=[...vs,...ms].map(o=>o.current).filter(Boolean).sort((a,b)=>new Date(b.time)-new Date(a.time))[0],drafts=[...vs,...ms].filter(x=>x.draft).length;return `<tr><td class="maincell"><div class="row">${filetype(x)}<div><button class="link" data-action="file" data-id="${x.id}">${E(x.name)}</button><span class="cell-sub">${E(x.group)}</span></div></div></td><td><div class="versions">${vs.slice().reverse().slice(0,3).map(v=>pill(v.version)).join('')}</div></td><td class="num">${ms.filter(x=>x.current).length} 台</td><td>${drafts?pill(drafts+' 份草稿','amber'):'<span class="muted">—</span>'}${pending().has(x.id)?'<div class="schedule-info">1 组更新待核对</div>':''}</td><td><span class="small">${E(T(latest?.time)||'尚未保存')}</span><span class="cell-sub">${E(latest?.author||'—')}</span></td><td>${btn('','file',{cls:'icon-only quiet',icon:'chevron',title:'管理 '+x.name,data:`data-id="${x.id}" aria-label="管理 ${E(x.name)}"`})}</td></tr>`}).join('')}</tbody></table>`}

function evolutionPage(){return `<section class="workspace" aria-label="版本演进"><div class="toolbar evolution-tools"><label class="searchbox">${icon('search')}<input id="evoSearch" type="search" placeholder="搜索软件版本或机台" aria-label="搜索版本或机台" value="${E(state.evoQuery)}"></label><select class="filterselect" id="evoFilter" aria-label="筛选配置状态"><option value="all" ${state.evoFilter==='all'?'selected':''}>全部状态</option><option value="draft" ${state.evoFilter==='draft'?'selected':''}>有草稿的配置</option></select><div class="right"><div class="segmented" role="group" aria-label="版本显示方式"><button data-action="view" data-view="graph" class="${state.view==='graph'?'active':''}" aria-pressed="${state.view==='graph'}">${icon('graph')}关系图</button><button data-action="view" data-view="list" class="${state.view==='list'?'active':''}" aria-pressed="${state.view==='list'}">${icon('list')}层级列表</button></div></div></div><div id="evolutionScroll" class="scroll ${state.view==='graph'?'graph-scroll':''}" tabindex="0" aria-label="${state.view==='graph'?'版本关系图，可横向和纵向滚动':'软件版本与机台层级列表'}">${evolutionBody()}</div><div id="evoFooter">${evolutionFooter()}</div></section>`}
function evolutionBody(){const groups=filteredVersions();if(!groups.length)return empty('没有匹配的版本或机台','清除搜索或切换状态筛选。',btn('清除筛选','clear-evo'));return state.view==='graph'?graphHTML(groups):hierarchyHTML(groups)}
function evolutionFooter(){return `<div class="tablefoot">${state.view==='graph'?`<div class="graphlegend"><span><i class="line-sample"></i>保存演进</span><span><i class="line-sample source"></i>参数来源</span><span><i class="box-sample"></i>草稿</span></div><div class="row">${btn('','zoom-out',{cls:'icon-only quiet',icon:'minus',title:'缩小关系图',data:'aria-label="缩小关系图"',disabled:state.zoom<=.75})}<span class="num">${Math.round(state.zoom*100)}%</span>${btn('','zoom-in',{cls:'icon-only quiet',icon:'plus',title:'放大关系图',data:'aria-label="放大关系图"',disabled:state.zoom>=1.25})}${btn('读图说明','graph-help',{cls:'text'})}</div>`:`<span>${filteredVersions().length} 个软件版本 · ${filteredVersions().reduce((n,g)=>n+g.children.length,0)} 台机台</span><div class="row">${btn('展开全部','expand-all',{cls:'text'})}${btn('收起全部','collapse-all',{cls:'text'})}</div>`}</div>`}
function graphHTML(groups){
  const allVersions=model.versions(f().id),ms=[...new Map(groups.flatMap(g=>g.children).map(m=>[m.id,m])).values()],selectedIds=new Set(groups.map(g=>g.v.id));
  const oldByMachine=new Map(ms.map(m=>[m.id,model.history(f().id,'machine',m.id).find(r=>r.version!==m.version)]));
  const neededVersions=new Set(groups.map(g=>g.v.version));for(const m of ms){if(m.draft)neededVersions.add(m.draft.targetVersion);const h=oldByMachine.get(m.id);if(h)neededVersions.add(h.version)}
  const vs=(!state.evoQuery&&state.evoFilter==='all'?allVersions:allVersions.filter(v=>neededVersions.has(v.version))).slice().sort((a,b)=>(a.id===103?-1:a.id)-(b.id===103?-1:b.id));
  const sources=new Set();ms.forEach(m=>{if(m.current?.sourceRevisionId)sources.add(m.current.sourceRevisionId);const h=oldByMachine.get(m.id);if(h?.sourceRevisionId)sources.add(h.sourceRevisionId)});
  const pastSources=new Map(vs.map(v=>[v.id,model.history(f().id,'standard',v.id).filter(r=>sources.has(r.id)&&r.id!==v.current?.id)]));
  const cw=218,lw=120,rh=87,hh=62,nw=164,nh=53,extra=Math.max(0,...[...pastSources.values()].map(x=>x.length))*66,W=lw+vs.length*cw,H=hh+(ms.length+2)*rh+extra+18;
  const rowY=row=>hh+row*rh+(row>1?extra:0),pos=(col,row)=>({x:lw+col*cw+(cw-nw)/2,y:rowY(row)+17});let nodes=[],edges=[],sourceKeys=new Map();
  vs.forEach((v,col)=>{
    if(v.initialValues)nodes.push({key:'i-'+v.id,...pos(col,0),title:'初始参数',sub:'只读快照',cls:'initial',kind:'standard',id:v.id,tab:'initial'});
    if(v.current){nodes.push({key:'s-'+v.id,...pos(col,1),title:v.draft?'版本标准 · 有草稿':'版本标准',sub:T(v.current.time),cls:v.draft?'draft':'',kind:'standard',id:v.id,tab:'parameters',edit:!!v.draft});sourceKeys.set(v.current.id,'s-'+v.id)}
    else if(v.draft)nodes.push({key:'s-'+v.id,...pos(col,1),title:'未保存标准',sub:'继续编辑草稿',cls:'draft',kind:'standard',id:v.id,tab:'parameters',edit:true});
    pastSources.get(v.id).forEach((rev,i)=>{const p=pos(col,1),key='sr-'+rev.id;nodes.push({key,...p,y:p.y+(i+1)*66,title:'来源标准快照',sub:T(rev.time),cls:'historical',kind:'standard',id:v.id,tab:'parameters',record:rev.id});sourceKeys.set(rev.id,key)});
    if(v.initialValues&&v.current)edges.push(['i-'+v.id,'s-'+v.id,'source']);if(v.previousId){edges.push(['i-'+v.previousId,'i-'+v.id,'saved']);if(v.current)edges.push(['s-'+v.previousId,'s-'+v.id,'saved'])}
  });
  ms.forEach((m,mi)=>{const col=vs.findIndex(v=>v.version===m.version),row=mi+2,old=oldByMachine.get(m.id),key='m-'+m.id;
    if(m.current){nodes.push({key,...pos(col,row),title:'当前配置',sub:T(m.current.time),cls:'current',kind:'machine',id:m.id,tab:'parameters'});const source=sourceKeys.get(m.current.sourceRevisionId);if(source)edges.push([source,key,'source'])}
    if(old){const oc=vs.findIndex(v=>v.version===old.version);if(oc>=0){nodes.push({key:'h-'+m.id,...pos(oc,row),title:'历史配置',sub:T(old.time),cls:'historical',kind:'machine',id:m.id,tab:'parameters',record:old.id});edges.push(['h-'+m.id,key,'saved']);const source=sourceKeys.get(old.sourceRevisionId);if(source)edges.push([source,'h-'+m.id,'source'])}}
    if(m.draft){let dc=vs.findIndex(v=>v.version===m.draft.targetVersion);if(dc<0)dc=col;if(dc===col&&m.current){const n=nodes.find(n=>n.key===key);n.title='当前配置 · 有草稿';n.cls='draft';n.edit=true}else{nodes.push({key:'d-'+m.id,...pos(dc,row),title:'待保存草稿',sub:m.draft.targetVersion!==m.version?'更新到 '+m.draft.targetVersion:'尚未正式保存',cls:'draft',kind:'machine',id:m.id,tab:'parameters',edit:true});if(m.current)edges.push([key,'d-'+m.id,'saved'])}}
  });
  const lines=edges.map(([a,b,type])=>{const p=nodes.find(n=>n.key===a),q=nodes.find(n=>n.key===b);if(!p||!q)return '';const d=p.y===q.y?`M${p.x+nw},${p.y+nh/2} H${q.x}`:`M${p.x+nw/2},${p.y+nh} V${q.y-10} H${q.x+nw/2} V${q.y}`;return `<path d="${d}" class="graph-line ${type}"/>`}).join('');
  return `<div style="width:${W*state.zoom}px;height:${H*state.zoom}px;min-width:100%"><div class="graph-canvas" style="width:${W}px;height:${H}px;transform:scale(${state.zoom})">${vs.map((v,i)=>`<div class="graph-column" style="left:${lw+i*cw}px;width:${cw}px"></div><div class="graph-vhead" style="left:${lw+i*cw}px;width:${cw}px"><button data-action="object" data-kind="standard" data-id="${v.id}" aria-label="打开软件 ${E(v.version)}">${E(v.version)}</button>${pill(!selectedIds.has(v.id)?'关联上下文':v.current?'已保存':'准备中',v.current?'':'amber')}</div>`).join('')}${['初始参数','版本标准',...ms.map(m=>m.name)].map((label,i)=>`<div class="graph-label" style="top:${rowY(i)+24}px">${E(label)}<span>${i===0?'软件初始值':i===1?'标准与来源快照':'机台配置'}</span></div><div class="graph-rule" style="top:${rowY(i+1)}px"></div>`).join('')}<svg width="${W}" height="${H}" style="position:absolute;inset:0;pointer-events:none" aria-hidden="true">${lines}</svg>${nodes.map(n=>`<button class="graph-node ${n.cls}" data-action="object" data-kind="${n.kind}" data-id="${n.id}" data-tab="${n.tab}" ${n.edit?'data-edit="true"':''} ${n.record?`data-record="${n.record}"`:''} data-focus-key="${n.key}" style="left:${n.x}px;top:${n.y}px" aria-label="${E((n.kind==='standard'?'软件 '+vs.find(v=>v.id===n.id)?.version:ms.find(m=>m.id===n.id)?.name)+'，'+n.title+'，'+n.sub)}"><i class="dot"></i><strong>${E(n.title)}</strong><span>${E(n.sub)}</span></button>`).join('')}</div></div>`;
}
function hierarchyHTML(groups){const collapsed=state.evoQuery?state.searchCollapsed:state.collapsed;return `<table class="table evo-table"><caption class="sr-only">软件版本及其正式归属的机台，草稿不会提前改变版本归属</caption><thead><tr><th>软件版本 / 机台</th><th>配置状态</th><th>最近保存</th><th>操作</th></tr></thead>${groups.slice().reverse().map(({v,children})=>{const open=!collapsed.has(v.id);return `<tbody><tr class="versionrow"><td><div class="tree-name"><button class="disclosure" data-action="toggle-version" data-id="${v.id}" aria-expanded="${open}" aria-controls="children-${v.id}" aria-label="${open?'收起':'展开'}软件 ${E(v.version)}">${icon(open?'down':'chevron')}</button><button class="link vername" data-action="object" data-id="${v.id}" data-kind="standard" data-focus-key="s-${v.id}">软件 ${E(v.version)}</button><span class="count">${children.length} 台机台</span></div></td><td><span class="small muted">标准参数</span> ${v.draft?pill('有草稿','amber'):v.current?'<span class="small muted">已保存</span>':pill('尚未保存','amber')}</td><td class="small muted">${E(T(v.current?.time)||'—')}</td><td>${btn(v.draft?'继续草稿':'编辑标准','object',{cls:'text',disabled:isViewer(),data:`data-kind="standard" data-id="${v.id}" data-edit="true"`})}</td></tr></tbody><tbody id="children-${v.id}" ${open?'':'hidden'}>${children.map(m=>`<tr><td><div class="tree-name tree-child">${icon('machine')}<button class="link" data-action="object" data-kind="machine" data-id="${m.id}" data-focus-key="m-${m.id}">${E(m.name)}</button></div></td><td>${m.draft?pill(m.current?'有草稿':'新建草稿','amber')+' '+(m.draft.targetVersion!==m.version?`<span class="small" style="color:var(--amber)">更新到 ${E(m.draft.targetVersion)}</span>`:''):'<span class="small muted">已保存</span>'}</td><td class="small muted">${E(T(m.current?.time)||'—')}</td><td>${btn(m.draft?'继续草稿':'编辑参数','object',{cls:'text',disabled:isViewer(),data:`data-kind="machine" data-id="${m.id}" data-edit="true"`})}</td></tr>`).join('')}</tbody>`}).join('')}</table>`}
function openObject(id,kind='machine',tab='parameters',edit=false,record=null){guard(()=>{remember();if(!model.object(state.route.fileId,kind,Number(id))){toast('此配置在当前文件中已不存在');return}if(record&&!model.history(state.route.fileId,kind,Number(id)).some(r=>r.id===record))record=null;state.route={screen:'object',fileId:state.route.fileId,kind,id:Number(id),tab,record};state.query='';state.group='all';state.filter='all';state.page=1;state.error='';state.errors={};state.session=null;state.baseline=null;state.exportText=null;commitRoute();if(edit&&!isViewer())startEdit();else render();$('#objectTitle')?.focus({preventScroll:true})})}
function currentValues(){const o=currentObject();if(state.route.record)return viewedRevision()?.values||{};if(state.route.tab==='initial')return o.initialValues||{};return state.session?.values||o.current?.values||{}}
function referenceValues(){const o=currentObject();if(state.route.record&&state.route.kind==='machine'){const rev=viewedRevision();return model.revision(rev?.sourceRevisionId)?.values||{}}if(state.route.kind==='standard')return o.initialValues||{};const version=state.session?.targetVersion||o.version;return model.standardFor(f().id,version)?.current?.values||{}}
function objectHeading(){const o=currentObject(),r=state.route,editing=!!state.session&&r.tab!=='export',readonly=isReadOnly(),version=state.session?.targetVersion||o.version,rev=r.record?viewedRevision():o.current;let status=editing?'编辑中':r.tab==='export'?'导出已保存快照':r.record?'历史快照':r.tab==='initial'?'初始参数 · 只读':o.current?'已保存':'尚未保存';let buttons=r.tab==='export'?'':readonly?btn('导出文件','export',{icon:'download',disabled:!Object.keys(currentValues()).length}):editing?btn('更多操作','more',{icon:'more'}):btn('导出文件','export',{icon:'download',disabled:!o.current})+btn(o.draft?'继续编辑草稿':'编辑参数','edit',{cls:'primary',icon:'edit'})+btn('','more',{cls:'icon-only',icon:'more',data:'aria-label="当前配置的更多操作"'});return `<div class="page-heading object-heading"><div><div class="identity">${icon(r.kind==='machine'?'machine':'branch')}<h1 id="objectTitle" tabindex="-1">${E(objectName(o))}</h1>${pill(status,editing?'blue':o.current&&!readonly?'green':'',!readonly)}</div><div class="object-meta">${r.kind==='machine'?`<span>软件 ${E(rev?.version||o.version)}</span>${!r.record&&version!==o.version?`<span style="color:var(--amber)">→ 草稿目标 ${E(version)}</span>`:''}<span>·</span>`:''}<span>${E(T(rev?.time)||'尚未保存')}</span>${rev?.author?`<span>· ${E(rev.author)}</span>`:''}</div></div><div class="object-actions">${buttons}</div></div>`}
function objectTabs(){const r=state.route,o=currentObject();let tabs=[['parameters',r.kind==='standard'?'标准参数':'参数']];if(r.kind==='standard')tabs.push(['initial','初始参数'],['machines','使用此版本的机台']);tabs.push(['history','修改记录']);return `<div class="tabs" aria-label="当前配置页面">${tabs.map(([id,label])=>`<button data-action="object-tab" data-tab="${id}" class="${r.tab===id?'active':''}" ${r.tab===id?'aria-current="page"':''}>${label}${id==='machines'?`<span class="tabnum">${model.machines(f().id).filter(m=>m.current&&m.version===o.version).length}</span>`:''}</button>`).join('')}</div>`}
function objectPage(){const o=currentObject();if(!o)return empty('配置不存在','返回配置文件重新选择。',btn('返回配置文件','files'));if(state.route.tab==='export')return objectHeading()+exportPage();let out=objectHeading()+objectTabs();if(state.route.tab==='machines')return out+versionMachines();if(state.route.tab==='history')return out+objectHistory();if(state.route.record)out+=`<div class="notice">${icon('history')}<span class="grow">正在查看历史快照，参数只读。</span>${btn('返回当前配置','latest',{cls:'text'})}</div>`;else if(state.route.tab==='initial')out+=`<div class="readonly-note">${icon('lock')}软件初始参数为独立快照，版本标准的修改不会覆盖此处。</div>`;else if(o.draft&&!state.session)out+=`<div class="notice amber">${icon('edit')}<span class="grow">${o.current?'当前显示上次保存的配置。':'此配置尚未正式保存。'}已有${o.draft.targetVersion!==o.version?'更新到 '+E(o.draft.targetVersion)+' 的':''}草稿。</span>${btn('继续编辑','edit',{cls:'text',disabled:isViewer()})}</div>`;if(state.error)out+=`<div class="notice red error-banner" role="alert">${icon('alert')}<span class="grow">${E(state.error)}</span>${btn('重新核对','save-review',{cls:'text'})}</div>`;out+=parameterWorkbench();if(state.session)out+=editBar();return out}
function parameterWorkbench(){const ps=model.parameters(f().id),groups=[...new Set(ps.map(p=>p.group))];if(state.route.tab==='initial'&&!currentObject().initialValues)return `<section class="workspace">${empty('初始参数尚未导入','新建软件版本时不会复制其他版本的初始参数。')}</section>`;return `<div class="editor"><nav class="directory" aria-label="参数目录"><div class="directory-label">参数目录</div><button data-action="category" data-group="all" class="${state.group==='all'?'active':''}"><span class="dir-name">${icon('list')}全部参数</span><span class="count">${ps.length}</span></button>${groups.map(g=>`<button data-action="category" data-group="${E(g)}" class="${state.group===g?'active':''}"><span class="dir-name">${icon('folder')}${E(g)}</span><span class="count">${ps.filter(p=>p.group===g).length}</span></button>`).join('')}</nav><section class="workspace parameter-work" aria-label="参数表"><div class="toolbar"><label class="searchbox">${icon('search')}<input type="search" id="paramSearch" aria-label="搜索参数" placeholder="搜索参数名称或文件字段" value="${E(state.query)}"><span class="key">/</span></label><div class="right">${btn('对比','compare',{icon:'compare',cls:'quiet',disabled:!!state.route.record})}${state.route.kind==='standard'&&!isReadOnly()?btn('导入','import',{icon:'upload',disabled:isViewer()}):''}${btn('','columns',{cls:'icon-only quiet',icon:'settings',data:'aria-label="参数表显示设置"',title:'显示列与密度'})}</div></div><div class="filterbar" id="parameterFilters">${parameterFilters()}</div><div class="scroll" id="parameterScroll" tabindex="0" aria-label="参数表滚动区域"><div id="parameterRows">${parameterRows()}</div></div><div class="tablefoot" id="parameterFooter">${parameterFooter()}</div></section></div>`}
function parameterFilters(){const ps=model.parameters(f().id),values=currentValues(),ref=referenceValues(),diff=ps.filter(p=>String(values[p.id]??'')!==String(ref[p.id]??'')).length,changes=state.session?model.changes(state.session).length:0;return [['all','全部',ps.length],...(state.route.kind==='machine'||currentObject().initialValues?[['different','与'+(state.route.kind==='standard'?'初始值':'标准值')+'不同',diff]]:[]),...(state.session?[['changed','本次修改',changes]]:[])].map(([id,label,count])=>`<button data-action="param-filter" data-filter="${id}" class="${state.filter===id?'active':''}">${label}<span>${count}</span></button>`).join('')}

function reviewSave(after){if(isViewer()||!state.session)return;state.errors=model.validate(state.session);if(Object.keys(state.errors).length){closeModal();state.route.tab='parameters';state.error='有 '+Object.keys(state.errors).length+' 项参数需要修正，请检查标红的字段。';render();$('[aria-invalid=true]')?.focus();return}const changes=model.changes(state.session),o=currentObject(),versionChange=state.session.targetVersion!==o.version;showModal('核对并保存配置',`<div class="dialog-summary"><span><strong>${changes.length}</strong> 项参数变化</span>${versionChange?`<span>${E(o.version)} ${icon('arrow')} <strong>${E(state.session.targetVersion)}</strong></span>`:''}</div><div class="table-wrap"><table class="table"><thead><tr><th>参数</th><th>上次保存</th><th>本次保存</th><th>取值方式</th></tr></thead><tbody>${changes.map(c=>`<tr><td>${E(c.param.name)}</td><td class="mono"><span class="diff-old">${E(c.oldValue??'—')}</span></td><td class="mono"><span class="diff-new">${E(c.newValue??'')}</span></td><td class="small muted">${c.oldMode!==c.newMode?E(modeLabel(c.oldMode))+' → '+E(modeLabel(c.newMode)):E(modeLabel(c.newMode))}</td></tr>`).join('')||`<tr><td colspan="4" class="muted">${versionChange?'参数值不变，仅更新版本及来源。':!o.current?'将保存此配置的第一条正式记录。':'参数值与上次保存一致。'}</td></tr>`}</tbody></table></div><div class="field"><label for="saveNote">修改说明 <span class="muted">（选填）</span></label><textarea id="saveNote" rows="2" placeholder="例如：调整相机曝光，匹配现场光源"></textarea></div><div class="notice">${icon('info')}<span>保存后生成历史记录。${state.route.kind==='standard'?'已有机台配置保持各自的当前值。':''}此操作不向真实机台下发配置。</span></div>`,[{label:'返回编辑',run:closeModal},{label:'保存配置',primary:true,disabled:!model.isDirty(state.session)&&!!o.current&&!o.draft,run:()=>performSave(after)}],{size:'medium',subtitle:objectName(o)+' · '+f().name})}
function performSave(after){if(isViewer()||!state.session)return;const note=$('#saveNote')?.value||'';if(state.saveScenario==='failure'){state.saveScenario='success';closeModal();state.error='保存失败：示例请求未完成。编辑内容已保留，可以重新核对后重试。';state.route.tab='parameters';render();return}try{if(state.saveScenario==='conflict'){state.saveScenario='success';const remote=model.begin(f().id,state.route.kind,state.route.id);const p=model.parameters(f().id).find(p=>p.type==='number'),v=Number(remote.values[p.id]||0);remote.values[p.id]=String(v+1);remote.modes[p.id]='custom';model.save(remote,'其他用户的示例修改')}const saved=model.save(state.session,note||'保存配置');const candidate=pending().get(f().id);if(state.route.kind==='standard'&&candidate?.targetId===state.route.id){for(const key of Object.keys(candidate.values))if(String(saved.values[key])===String(candidate.values[key]))delete candidate.values[key];if(!Object.keys(candidate.values).length)pending().delete(f().id)}state.session=null;state.baseline=null;state.errors={};state.error='';state.route.tab='parameters';closeModal();commitRoute();render();toast('配置已保存，历史快照已保留');after?.()}catch(e){if(e.code==='CONFLICT')showConflict();else modalError(e.message)}}
function showConflict(){
  const session=state.session,o=currentObject(),baseRevision=model.revision(session.baseRevisionId),base=baseRevision?.values||{},baseModes=baseRevision?.modes||{},server=o.current.values,serverModes=o.current.modes,ps=model.parameters(f().id);
  const localChanged=p=>String(session.values[p.id]??'')!==String(base[p.id]??'')||session.modes[p.id]!==baseModes[p.id];
  const serverChanged=p=>String(server[p.id]??'')!==String(base[p.id]??'')||serverModes[p.id]!==baseModes[p.id];
  const conflicts=ps.filter(p=>localChanged(p)&&serverChanged(p)&&(String(session.values[p.id])!==String(server[p.id])||session.modes[p.id]!==serverModes[p.id]));
  const localTargetChanged=session.targetVersion!==baseRevision?.version||session.sourceRevisionId!==baseRevision?.sourceRevisionId;
  const serverTargetChanged=o.current.version!==baseRevision?.version||o.current.sourceRevisionId!==baseRevision?.sourceRevisionId;
  const targetConflict=localTargetChanged&&serverTargetChanged&&(session.targetVersion!==o.current.version||session.sourceRevisionId!==o.current.sourceRevisionId);
  showModal('配置已被其他人修改',`<div class="notice amber">${icon('alert')}<span>你的编辑内容已保留。请合并最新记录，再核对保存。</span></div><div class="table-wrap"><table class="table"><thead><tr><th>参数</th><th>最新保存</th><th>你的编辑</th><th>保留内容</th></tr></thead><tbody>${conflicts.map(p=>`<tr><td>${E(p.name)}</td><td><span class="mono">${E(server[p.id])}</span><span class="cell-sub">${E(modeLabel(serverModes[p.id]))}</span></td><td><span class="mono">${E(session.values[p.id])}</span><span class="cell-sub">${E(modeLabel(session.modes[p.id]))}</span></td><td><select data-conflict="${p.id}" aria-label="${E(p.name)}的并发处理"><option value="">请选择</option><option value="local">保留我的编辑</option><option value="server">使用最新保存值</option></select></td></tr>`).join('')||'<tr><td colspan="4">双方没有修改同一参数，可以合并。</td></tr>'}</tbody></table></div>${targetConflict?`<div class="field"><label for="conflictTarget">目标版本及标准来源冲突</label><select id="conflictTarget"><option value="">请选择</option><option value="local">保留我的目标版本 ${E(session.targetVersion)}</option><option value="server">采用最新版本 ${E(o.current.version)}</option></select></div>`:serverTargetChanged&&!localTargetChanged?`<p class="small muted">采用其他用户已保存的软件版本 ${E(o.current.version)} 及其标准来源。</p>`:''}`,[{label:'返回编辑',run:closeModal},{label:'合并到编辑内容',primary:true,run:()=>{
    const decisions={};for(const el of document.querySelectorAll('[data-conflict]')){if(!el.value){el.focus();modalError('请选择每项冲突的处理方式。');return}decisions[el.dataset.conflict]=el.value}
    if(targetConflict&&!$('#conflictTarget').value){$('#conflictTarget').focus();modalError('请选择目标版本及来源。');return}
    const merged={fileId:session.fileId,kind:session.kind,id:session.id,baseRevisionId:o.current.id,values:clone(server),modes:clone(serverModes),targetVersion:o.current.version,sourceRevisionId:o.current.sourceRevisionId};
    for(const p of ps)if(localChanged(p)&&decisions[p.id]!=='server'){merged.values[p.id]=session.values[p.id];merged.modes[p.id]=session.modes[p.id]}
    if(localTargetChanged&&(!targetConflict||$('#conflictTarget').value==='local')){merged.targetVersion=session.targetVersion;merged.sourceRevisionId=session.sourceRevisionId}
    state.baseline={fileId:session.fileId,kind:session.kind,id:session.id,baseRevisionId:o.current.id,values:clone(server),modes:clone(serverModes),targetVersion:o.current.version,sourceRevisionId:o.current.sourceRevisionId};state.session=merged;closeModal();state.error='';state.errors=model.validate(merged);state.route.tab='parameters';render();toast('已合并，请核对后保存')
  }}],{size:'wide'});
}

function upgradeReview(version){const o=currentObject(),sourceSession=state.session||model.begin(f().id,'machine',o.id),diffs=model.compareSessionUpgrade(sourceSession,version),visible=diffs.filter(x=>x.status!=='unchanged'),counts={unchanged:0,update:0,custom:0,conflict:0};diffs.forEach(x=>counts[x.status]++);showModal('核对标准更新',`<div class="dialog-summary"><span>${E(o.name)} · ${E(o.version)} ${icon('arrow')} <strong>${E(version)}</strong></span><span>${counts.update} 项跟随新标准</span><span>${counts.custom} 项保留机台值</span><span class="warn"><strong>${counts.conflict}</strong> 项需要选择</span></div><div class="table-wrap"><table class="table" style="min-width:670px"><thead><tr><th>参数</th><th>原来的标准</th><th>${o.draft||state.session?'当前草稿 / 编辑值':'当前配置'}</th><th>新的标准</th><th>处理方式</th></tr></thead><tbody>${visible.map(d=>`<tr><td>${E(d.param.name)}</td><td class="mono muted">${E(d.oldValue)}</td><td class="mono">${E(d.currentValue)}</td><td class="mono">${E(d.newValue)}</td><td>${d.status==='conflict'?`<select class="diff-choice" data-upgrade-choice="${d.param.id}" aria-label="${E(d.param.name)}的更新处理"><option value="">请选择</option><option value="current">保留当前值 ${E(d.currentValue)}</option><option value="new">使用新标准 ${E(d.newValue)}</option></select>`:d.status==='update'?'<span class="small" style="color:var(--blue)">使用新标准</span>':'<span class="small muted">保留机台设置</span>'}</td></tr>`).join('')||'<tr><td colspan="5">参数值相同，将更新版本和标准来源。</td></tr>'}</tbody></table></div><div class="content-note">${counts.unchanged} 项保持不变。继续后进入编辑，正式保存后才改变机台的软件版本归属。</div>`,[{label:'返回',run:startUpgrade},{label:'继续编辑',primary:true,run:()=>{const choices={};for(const el of document.querySelectorAll('[data-upgrade-choice]')){if(!el.value){el.focus();modalError('请选择每项冲突的处理方式。');return}choices[el.dataset.upgradeChoice]=el.value}try{const original=clone(sourceSession);state.session=model.applyUpgrade(original,version,choices);state.baseline=clone(original);state.route.tab='parameters';state.route.record=null;stat function setImportSample(){importGeneration++;const ps=model.parameters(f().id),values={};ps.forEach(p=>{const current=currentValues()[p.id];values[p.id]=current===undefined||(current===''&&p.type!=='text')?p.initial:current});if(values.feed!==undefined)values.feed='150';if(values.exposure!==undefined)values.exposure='12';modalState.importData={name:'示例-'+f().name,values,unknown:[]};$('#importFileStatus').textContent='已选择：'+modalState.importData.name;toast('示例文件已准备')}
async function readImportFile(file){const generation=++importGeneration,scopedFile=f().id,scopedModel=model;modalState.importData=null;if(!file)return;if(file.size>5*1024*1024){modalError('原型支持 5 MB 以内的 XML / JSON 文件。');return}try{const text=await file.text();if(generation!==importGeneration||!$('#importFileStatus')||model!==scopedModel||f().id!==scopedFile)return;const ps=scopedModel.parameters(scopedFile),values={},unknown=[];let raw={};function flatten(x,path=''){if(x&&typeof x==='object'&&!Array.isArray(x)){for(const [k,v] of Object.entries(x))flatten(v,path?path+'/'+k:k)}else raw[path]=x===null?'':String(x)}if(file.name.toLowerCase().endsWith('.json')){flatten(JSON.parse(text));}else if(file.name.toLowerCase().endsWith('.xml')){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('XML 格式不正确');const walk=(el,path)=>{const kids=[...el.children];if(!kids.length)raw[path]=el.textContent;else kids.forEach(child=>walk(child,path?path+'/'+child.tagName:child.tagName))};[...doc.documentElement.children].forEach(el=>walk(el,el.tagName))}else throw Error('请选择 .xml 或 .json 文件');for(const [field,value] of Object.entries(raw)){const p=ps.find(p=>p.field===field||p.id===field||p.name===field);if(p)values[p.id]=String(value);else unknown.push({field,value})}modalState.importData={name:file.name,values,unknown};$('#importFileStatus').textContent=file.name+' · '+Object.keys(values).length+' 项已匹配';$('#modalError')?.remove()}catch(e){if(generation!==importGeneration||!$('#importFileStatus'))return;modalState.importData=null;modalError('文件读取失败：'+e.message+'。请选择有效文件后重试。')}}
function importReview(namesOnly=false){const data=modalState.importData,ps=model.parameters(f().id),known=ps.filter(p=>p.id in data.values);modalState.namesOnly=namesOnly;showModal('核对导入内容',`<div class="dialog-steps"><span>选择文件</span>${icon('chevron')}<span class="active">核对参数</span>${icon('chevron')}<span>编辑草稿</span></div><div class="dialog-summary"><span>${E(data.name)}</span><span>${known.length} 项已匹配</span>${data.unknown.length?`<span class="warn">${data.unknown.length} 个字段未匹配</span>`:''}</div><div class="table-wrap"><table class="table" style="min-width:550px"><thead><tr><th>参数 / 字段</th><th>类型</th>${namesOnly?'':'<th>文件中的值</th>'}<th>处理方式</th></tr></thead><tbody>${known.map(p=>`<tr><td>${E(p.name)}<span class="cell-sub mono">${E(p.field)}</span></td><td class="small muted">${E(p.type)}</td>${namesOnly?'':`<td class="mono">${E(data.values[p.id])}</td>`}<td><span class="small">${namesOnly?'名称已存在':'更新已有参数'}</span></td></tr>`).join('')}${data.unknown.map((x,i)=>`<tr><td class="mono">${E(x.field)}</td><td class="muted">未确认</td>${namesOnly?'':`<td class="mono">${E(x.value)}</td>`}<td><select data-unknown="${i}" aria-label="字段 ${E(x.field)}的处理方式"><option value="">请选择</option><option value="skip">本次忽略</option></select></td></tr>`).join('')}</tbody></table></div><div class="content-note">${namesOnly?'本次仅核对参数名称，不修改参数值。':'未出现在文件中的参数保持原样。字段未匹配时需明确忽略；新增定义由宿主参数管理处理。'}</div>`,[{label:'返回',run:importDialog},{label:namesOnly?'完成核对':'导入到编辑内容',primary:true,disabled:!known.length,run:()=>{for(const el of document.querySelectorAll('[data-unknown]'))if(!el.value){el.focus();modalError('请明确处理所有未匹配字段。');return}if(namesOnly){closeModal();toast('参数名称和字段已核对，数值保持原样');return}try{const base=state.session||model.begin(f().id,state.route.kind,state.route.id);if(!state.session)state.baseline=clone(base);state.session=model.importValues(base,data.values,false);state.route.tab='parameters';state.route.record=null;state.errors=model.validate(state.session);closeModal();commitRoute();render();toast('导入内容已进入编辑，尚未正式保存')}catch(e){modalError(e.message)}}}],{size:'wide'})}
function updateSettings(){if(isViewer()||f().id!==0)return;const u=updatesState();showModal('更新设置',`<div class="field"><label for="sourcePath">来源路径</label><input id="sourcePath" value="${E(u.path)}" placeholder="/simulation/MachineConfig.xml"></div><div class="fields"><div class="field"><label for="updateFrequency">更新频率</label><select id="updateFrequency">${[['15','每 15 分钟'],['30','每 30 分钟'],['60','每小时'],['1440','每天']].map(([v,l])=>`<option value="${v}" ${u.frequency===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="updateEnabled">自动更新</label><select id="updateEnabled"><option value="on" ${u.enabled?'selected':''}>启用</option><option value="off" ${!u.enabled?'selected':''}>暂停</option></select></div></div><dl class="data-grid"><dt>更新目标</dt><dd>软件 690 的版本标准</dd><dt>连接状态</dt><dd>${pill('示例连接','blue')} <span class="small muted">原型不连接真实 SDA 服务</span></dd><dt>更新处理</dt><dd>获取后生成待核对内容，人工保存</dd></dl><div class="content-note">此设置仅用于演示来源与更新计划，不会发起真实网络请求。</div>`,[{label:'取消',run:closeModal},{label:'保存设置',primary:true,run:()=>{if(!$('#sourcePath').value.trim()){modalError('请填写来源路径。');return}u.path=$('#sourcePath').value.trim();u.frequency=$('#updateFrequency').value;u.enabled=$('#updateEnabled').value==='on';closeModal();render();toast('示例更新设置已保存')}}],{subtitle:f().name})}
function runUpdate(){const u=updatesState();if(u.running||isViewer())return;u.running=true;u.failed=false;const scopedModel=model,scope=state.workspace;render();setTimeout(()=>{const target=model===scopedModel?model:models[scope],saved=target.object(0,'standard',101)?.current;u.running=false;u.last='刚刚';if(state.updateScenario==='failure'){state.updateScenario='success';u.failed=true;u.runs.unshift({time:'刚刚',status:'error',detail:'示例会话已过期；未改动正式配置',actor:'手动更新'})}else{const values={exposure:String(Number(saved?.values.exposure||8)+1),startDelay:String(Number(saved?.values.startDelay||20)+5)};pendingByWorkspace[scope].set(0,{id:'candidate-'+Date.now(),targetId:101,values,time:'刚刚',source:'SDA 标准参数'});u.runs.unshift({time:'刚刚',status:'pending',detail:'获取完成，2 项变化待核对',actor:'手动更新'})}if(state.workspace===scope){render();toast(u.failed?'更新失败，已有内容已保留':'已获取示例更新，等待核对')}},650)}
function reviewUpdate(){
 if(isViewer())return;const candidate=pending().get(f().id),o=candidate&&model.object(f().id,'standard',candidate.targetId);if(!candidate||!o)return;
 const base=model.begin(f().id,'standard',o.id),ps=model.parameters(f().id).filter(p=>p.id in candidate.values),conflicts=new Set(ps.filter(p=>String(base.values[p.id])!==String(o.current.values[p.id])&&String(base.values[p.id])!==String(candidate.values[p.id])).map(p=>p.id));
 showModal('核对来源更新',`<div class="dialog-summary"><span>${E(candidate.source)}</span><span>软件 ${E(o.version)}</span><span>${ps.length} 项来源变化</span>${conflicts.size?`<span class="warn">${conflicts.size} 项与已有草稿冲突</span>`:''}</div><div class="table-wrap"><table class="table" style="min-width:${o.draft?'640':'500'}px"><thead><tr><th>参数</th><th>已保存标准</th>${o.draft?'<th>已有草稿</th>':''}<th>来源新值</th><th>处理方式</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${E(p.name)}</td><td class="mono">${E(o.current.values[p.id])}</td>${o.draft?`<td class="mono">${E(base.values[p.id])}</td>`:''}<td class="mono"><span class="diff-new">${E(candidate.values[p.id])}</span></td><td>${conflicts.has(p.id)?`<select data-update-decision="${p.id}" aria-label="${E(p.name)}的草稿合并"><option value="">请选择</option><option value="keep">保留草稿值 ${E(base.values[p.id])}</option><option value="source">采用来源值 ${E(candidate.values[p.id])}</option></select>`:`<label class="checkbox-label"><input type="checkbox" data-update-check="${p.id}" aria-label="采用${E(p.name)}的更新" checked>采用</label>`}</td></tr>`).join('')}</tbody></table></div><div class="notice">${icon('info')}<span>采用的来源值会合并到已有草稿，其余草稿参数保留。正式保存后生效，机台配置保持原样。</span></div>`,[{label:'取消',run:closeModal},{label:'继续编辑',primary:true,run:()=>{
   const values={};document.querySelectorAll('[data-update-check]:checked').forEach(el=>values[el.dataset.updateCheck]=candidate.values[el.dataset.updateCheck]);for(const el of document.querySelectorAll('[data-update-decision]')){if(!el.value){el.focus();modalError('请选择每项草稿冲突的处理方式。');return}if(el.value==='source')values[el.dataset.updateDecision]=candidate.values[el.dataset.updateDecision]}
   if(!Object.keys(values).length){closeModal();toast('未采用来源变化，已有草稿已保留');return}
   state.route={screen:'object',fileId:f().id,kind:'standard',id:o.id,tab:'parameters'};state.baseline=clone(base);state.session=model.importValues(base,values);state.explicitModes.clear();state.errors={};state.error='';state.group='all';state.query='';state.filter='changed';state.page=1;closeModal();commitRoute();render()
 }}],{size:o.draft?'wide':'medium'});
}
function prototypeSettings(){showModal('原型说明与演示设置',`<p>所有内容均为示例。编辑、草稿和设置只保留到本次页面关闭或刷新，不连接真实服务，也不向机台下发配置。</p><div class="fields"><div class="field"><label for="demoRole">当前身份</label><select id="demoRole"><option value="admin" ${!isViewer()?'selected':''}>管理员</option><option value="viewer" ${isViewer()?'selected':''}>访客 · 只读</option></select></div><div class="field"><label for="demoSave">下一次保存</label><select id="demoSave"><option value="success">正常保存</option><option value="failure">模拟保存失败</option><option value="conflict">模拟并发修改</option></select></div><div class="field"><label for="demoUpdate">下一次来源更新</label><select id="demoUpdate"><option value="success">正常获取</option><option value="failure">模拟会话过期</option></select></div></div><details><summary>查看大数据与快捷键</summary><div class="row spread"><span class="small muted">将当前文件扩展为 3,248 项示例参数</span>${btn('加载长列表','stress-data',{cls:'small',disabled:!!state.session})}</div><div class="small muted" style="margin-top:10px"><span class="kbd">/</span> 聚焦参数搜索；<span class="kbd">Ctrl / ⌘ + S</span> 核对保存；<span class="kbd">Esc</span> 关闭弹窗。</div></details>`,[{label:'关闭',run:closeModal},{label:'应用设置',primary:true,run:()=>{const role=$('#demoRole').value,save=$('#demoSave').value,update=$('#demoUpdate').value;closeModal();guard(()=>{state.role=role;state.saveScenario=save;state.updateScenario=update;if(isViewer()){state.session=null;state.baseline=null}render();toast('演示设置已应用')})}}])}
function displaySettings(){showModal('参数表显示',`<label class="checkbox-label"><input type="checkbox" id="showField" ${state.showField?'checked':''}>显示文件字段</label><label class="checkbox-label"><input type="checkbox" id="compactTable" ${state.compact?'checked':''}>紧凑行高</label><div class="field"><label for="pageSize">每页参数</label><select id="pageSize">${[30,50,100].map(n=>`<option value="${n}" ${state.pageSize===n?'selected':''}>${n} 项</option>`).join('')}</select></div>`,[{label:'取消',run:closeModal},{label:'应用',primary:true,run:()=>{state.showField=$('#showField').checked;state.compact=$('#compactTable').checked;state.pageSize=Number($('#pageSize').value);state.page=1;closeModal();render()}}])}
function bindPageSpecific(){}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;e.preventDefault();const a=el.dataset.action;if(isViewer()&&['new-version','new-machine','edit','stash','save-review','upgrade','import','review-update','update-settings','run-update','update-all','discard-draft'].includes(a))return;switch(a){
case'files':navigate({screen:'files',fileId:0});break;case'file':if(Number(el.dataset.id)!==state.route.fileId){state.evoQuery='';state.evoFilter='all'}navigate({screen:'evolution',fileId:Number(el.dataset.id)});break;
case'file-tab':navigate({screen:el.dataset.tab,fileId:state.route.fileId},{keepFilters:true});break;
case'object':state.selection=el.dataset.focusKey||`${el.dataset.kind==='standard'?'s':'m'}-${el.dataset.id}`;closeModal();openObject(Number(el.dataset.id),el.dataset.kind||'machine',el.dataset.tab||'parameters',el.dataset.edit==='true',el.dataset.record||null);break;
case'view':remember();state.view=el.dataset.view;commitRoute();render();restorePosition();break;
case'toggle-version':{const set=state.evoQuery?state.searchCollapsed:state.collapsed,id=Number(el.dataset.id);set.has(id)?set.delete(id):set.add(id);const y=$('#evolutionScroll').scrollTop;$('#evolutionScroll').innerHTML=evolutionBody();$('#evolutionScroll').scrollTop=y;$(`[data-action="toggle-version"][data-id="${id}"]`)?.focus({preventScroll:true});break}
case'expand-all':(state.evoQuery?state.searchCollapsed:state.collapsed).clear();$('#evolutionScroll').innerHTML=evolutionBody();break;case'collapse-all':filteredVersions().forEach(g=>(state.evoQuery?state.searchCollapsed:state.collapsed).add(g.v.id));$('#evolutionScroll').innerHTML=evolutionBody();break;
case'zoom-in':case'zoom-out':state.zoom=Math.max(.75,Math.min(1.25,Math.round((state.zoom+(a==='zoom-in'?.1:-.1))*100)/100));$('#evolutionScroll').innerHTML=evolutionBody();$('#evoFooter').innerHTML=evolutionFooter();break;
case'clear-evo':state.evoQuery='';state.evoFilter='all';render();break;case'clear-file-search':state.fileQuery='';render();break;
case'graph-help':showModal('版本关系图',`<p>每列是一个软件版本，每行是初始参数、版本标准或一台机台。点击节点进入完整配置页面。</p><p>实线连接显式记录的演进关系；虚线连接参数来源。草稿用琥珀色虚线框表示，保存后才改变正式归属。</p><p>需要批量查找或编辑时，可切换到层级列表。</p>`,[{label:'知道了',run:closeModal}]);break;
case'new-version':createVersion();break;case'new-machine':createMachine();break;
case'edit':startEdit();break;case'cancel-edit':guard(()=>{state.session=null;state.baseline=null;state.errors={};state.error='';render()});break;case'stash':stash();break;case'save-review':reviewSave();break;
case'object-tab':closeModal();navigate({...state.route,tab:el.dataset.tab,record:null});break;case'snapshot':navigate({...state.route,tab:'parameters',record:el.dataset.record});break;case'latest':navigate({...state.route,tab:'parameters',record:null});break;
case'category':state.group=el.dataset.group;state.page=1;render();break;case'param-filter':state.filter=el.dataset.filter;state.page=1;refreshParameters();break;case'clear-params':state.query='';state.group='all';state.filter='all';state.page=1;render();break;
case'prev-page':state.page--;refreshParameters();$('#parameterScroll').scrollTop=0;break;case'next-page':state.page++;refreshParameters();$('#parameterScroll').scrollTop=0;break;
case'param-detail':parameterDetail(el.dataset.id);break;case'columns':displaySettings();break;case'compare':compareDialog();break;case'mapping':mappingDialog();break;case'more':moreMenu();break;
case'upgrade':startUpgrade();break;case'discard-draft':showModal('放弃已暂存草稿？',`<p>正式配置和已保存历史不受影响，已暂存的草稿将被清除。</p>`,[{label:'保留草稿',run:closeModal},{label:'放弃草稿',danger:true,run:()=>{const result=model.discardDraft(f().id,state.route.kind,state.route.id);state.session=null;state.baseline=null;if(result?.removed)state.route={screen:'evolution',fileId:f().id};closeModal();commitRoute();render();toast('已放弃草稿')}}]);break;
case'import':importDialog();break;case'import-sample':setImportSample();break;case'export':beginExport();break;case'export-back':state.route.tab='parameters';commitRoute();render();break;case'preview-export':state.exportText=model.exportText(f().id,exportValues(),state.exportFormat);render();break;case'download':if(state.exportText)downloadText(state.exportText,exportFilename(),state.exportFormat);break;
case'updates-tab':state.updatesTab=el.dataset.tab;render();break;case'update-settings':updateSettings();break;case'run-update':runUpdate();break;
case'update-all':showModal('更新当前工作区的全部来源',`<p>将获取 1 个已配置来源：MachineConfig.xml。标准参数.json 尚无更新来源。</p><p>获取结果进入待处理变化，保存版本标准前需要逐项核对。</p>`,[{label:'取消',run:closeModal},{label:'开始更新',primary:true,run:()=>{closeModal();state.route={screen:'updates',fileId:0};commitRoute();runUpdate()}}]);break;

case'prototype':prototypeSettings();break;case'stress-data':if(typeof model.addDemoParameters==='function'){model.addDemoParameters(f().id,Math.max(0,3248-model.parameters(f().id).length));closeModal();render();toast('已加载 3,248 项示例参数，刷新页面可还原')}else modalError('当前模型未提供长列表数据扩展。');break;
case'close-modal':closeModal();break;
}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='paramSearch'){state.query=el.value;state.page=1;refreshParameters()}else if(el.id==='evoSearch'){state.evoQuery=el.value;state.searchCollapsed.clear();$('#evolutionScroll').innerHTML=evolutionBody();$('#evoFooter').innerHTML=evolutionFooter()}else if(el.id==='fileSearch'){state.fileQuery=el.value;$('#fileRows').innerHTML=fileTable(model.files.filter(x=>(x.name+x.group).toLowerCase().includes(el.value.toLowerCase())))}else if(el.id==='recordSearch'){state.recordQuery=el.value;$('#recordRows').innerHTML=recordRows()}else if(el.dataset.valueId&&state.session){const id=el.dataset.valueId;state.session.values[id]=el.value;if(state.route.kind==='machine'){state.session.modes[id]=!state.explicitModes.has(id)&&String(el.value)===String(state.baseline?.values[id]??'')?state.baseline.modes[id]:'custom'}const sel=$(`[data-mode-id="${id}"]`);if(sel)sel.value=state.session.modes[id];const errors=model.validate(state.session),error=errors[id];if(error)state.errors[id]=error;else delete state.errors[id];el.setAttribute('aria-invalid',!!error);const note=$('#error-'+id);if(note){note.textContent=error||'';note.hidden=!error}el.closest('tr')?.classList.toggle('error',!!error);updateEditStatus()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='workspaceSelect'){const target=el.value;el.value=state.workspace;guard(()=>{state.workspace=target;model=models[target];state.route={screen:'files',fileId:0};state.session=null;state.baseline=null;state.evoQuery='';state.collapsed.clear();state.searchCollapsed.clear();state.query='';state.fileQuery='';state.recordQuery='';state.error='';state.errors={};state.selection=null;commitRoute();render();toast('已切换到'+(target==='default'?'默认工作区':'试验工作区'))})}else if(el.id==='evoFilter'){state.evoFilter=el.value;$('#evolutionScroll').innerHTML=evolutionBody();$('#evoFooter').innerHTML=evolutionFooter()}else if(el.dataset.modeId&&state.session){const id=el.dataset.modeId;state.explicitModes.add(id);state.session.modes[id]=el.value;if(el.value==='standard')state.session.values[id]=String(model.standardValues(state.session)[id]??'');state.errors=model.validate(state.session);refreshParameters()}else if(el.id==='compareTarget'||el.id==='compareOnlyDiff')updateCompare();else if(el.id==='exportFormat'){state.exportFormat=el.value;state.exportText=null;render()}else if(el.id==='importFile')readImportFile(el.files[0]);});
document.addEventListener('keydown',e=>{const input=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);if(e.key==='/'&&!input&&!$('#modal')&&$('#paramSearch')){e.preventDefault();$('#paramSearch').focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&state.session&&!$('#modal')){e.preventDefault();reviewSave()}});
